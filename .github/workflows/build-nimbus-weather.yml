name: Build Nimbus Alltag v2 APK
on:
  push:
    branches: [nimbus-dashboard-v2]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Nimbus Alltag
        run: gradle --no-daemon :app:assembleDebug
      - name: Check APK archive
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 1
      - uses: actions/upload-artifact@v4
        with:
          name: NimbusAlltag-v2-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
